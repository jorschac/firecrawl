name: firecrawl

x-common-service: &common-service
  # NOTE: If you don't want to build the service locally,
  # comment out the build: statement and uncomment the image: statement
  # image: ghcr.io/firecrawl/firecrawl
  build:
    context: apps/api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    args:
      HTTP_PROXY: ${HTTP_PROXY:-http://host.docker.internal:7897}
      HTTPS_PROXY: ${HTTPS_PROXY:-http://host.docker.internal:7897}
      http_proxy: ${HTTP_PROXY:-http://host.docker.internal:7897}
      https_proxy: ${HTTPS_PROXY:-http://host.docker.internal:7897}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}

  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  networks:
    - backend
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

x-common-env: &common-env
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  REDIS_RATE_LIMIT_URL: ${REDIS_RATE_LIMIT_URL:-${REDIS_URL:-redis://redis:6379}}
  PLAYWRIGHT_MICROSERVICE_URL: ${PLAYWRIGHT_MICROSERVICE_URL:-http://playwright-service:3000/scrape}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_HOST: ${POSTGRES_HOST:-nuq-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  USE_DB_AUTHENTICATION: ${USE_DB_AUTHENTICATION:-false}
  NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-1}
  CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-6}
  MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-4}
  BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-1}
  NUQ_WORKER_COUNT: ${NUQ_WORKER_COUNT:-1}
  HARNESS_SKIP_EXTRACT_WORKER: ${HARNESS_SKIP_EXTRACT_WORKER:-true}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL}
  MODEL_NAME: ${MODEL_NAME}
  MODEL_EMBEDDING_NAME: ${MODEL_EMBEDDING_NAME}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
  AUTUMN_SECRET_KEY: ${AUTUMN_SECRET_KEY}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
  BULL_AUTH_KEY: ${BULL_AUTH_KEY}
  TEST_API_KEY: ${TEST_API_KEY}
  SUPABASE_ANON_TOKEN: ${SUPABASE_ANON_TOKEN}
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_SERVICE_TOKEN: ${SUPABASE_SERVICE_TOKEN}
  SELF_HOSTED_WEBHOOK_URL: ${SELF_HOSTED_WEBHOOK_URL}
  LOGGING_LEVEL: ${LOGGING_LEVEL}
  PROXY_SERVER: ${PROXY_SERVER}
  PROXY_USERNAME: ${PROXY_USERNAME}
  PROXY_PASSWORD: ${PROXY_PASSWORD}
  ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS:-true}
  SELF_HOSTED_RATE_LIMIT_POINTS: ${SELF_HOSTED_RATE_LIMIT_POINTS:-50}
  SELF_HOSTED_RATE_LIMIT_DURATION: ${SELF_HOSTED_RATE_LIMIT_DURATION:-60}
  # Colima/Clash: API outbound (OpenCode, DDG, fetch) must use the host proxy.
  NODE_USE_ENV_PROXY: ${NODE_USE_ENV_PROXY:-1}
  HTTP_PROXY: ${HTTP_PROXY:-${PROXY_SERVER}}
  HTTPS_PROXY: ${HTTPS_PROXY:-${PROXY_SERVER}}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,redis,nuq-postgres,playwright-service,obscura,obscura-2,api}
  SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT}
  SEARXNG_ENGINES: ${SEARXNG_ENGINES}
  SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES}
  # When set, Brave Search API replaces DuckDuckGo as the search backend.
  BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
  # Set NUQ_BACKEND=fdb to run the queue on FoundationDB instead of Postgres
  NUQ_BACKEND: ${NUQ_BACKEND}
  FDB_CLUSTER_FILE: ${NUQ_BACKEND:+/var/fdb/fdb.cluster}

services:
  # Experimental: Playwright talks to Obscura over CDP. Chromium is not installed
  # in this image when INSTALL_CHROMIUM=false.
  playwright-service:
    # NOTE: If you don't want to build the service locally,
    # comment out the build: statement and uncomment the image: statement
    # image: ghcr.io/firecrawl/playwright-service:latest
    build:
      context: apps/playwright-service-ts
      args:
        INSTALL_CHROMIUM: ${INSTALL_CHROMIUM:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3000
      BROWSER_ENGINE: ${BROWSER_ENGINE:-obscura}
      OBSCURA_CDP_URLS: ${OBSCURA_CDP_URLS:-http://obscura:9222,http://obscura-2:9222}
      PROXY_SERVER: ${PROXY_SERVER}
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS}
      BLOCK_MEDIA: ${BLOCK_MEDIA}
      # Pages per browser instance. Obscura breaks page.content() on other pages
      # in the same process whenever one page navigates, so keep this at 1 and
      # scale with more Obscura instances; extra requests wait in the queue.
      MAX_CONCURRENT_PAGES: ${PLAYWRIGHT_MAX_CONCURRENT_PAGES:-1}
    depends_on:
      - obscura
      - obscura-2
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 288m
    memswap_limit: 288m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # Proxy is Clash on the host. --stealth is a global flag (fingerprint; TLS impersonation only if this image was built with the stealth feature).
  obscura: &obscura-service
    image: h4ckf0r0day/obscura:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --stealth
      - serve
      - --port
      - "9222"
      - --host
      - "0.0.0.0"
      - --proxy
      - ${PROXY_SERVER:-http://host.docker.internal:7897}
      # host.docker.internal is RFC1918; Obscura blocks it unless allowed.
      - --allow-private-network
    expose:
      - "9222"
    networks:
      - backend
    restart: unless-stopped
    cpus: 0.5
    # Measured ~80–110MiB under load; two instances stay near the old 450m budget.
    mem_limit: 200m
    memswap_limit: 200m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  obscura-2:
    <<: *obscura-service

  api:
    <<: *common-service
    environment:
      <<: *common-env
      HOST: "0.0.0.0"
      PORT: ${INTERNAL_PORT:-3002}
      WORKER_PORT: ${WORKER_PORT:-3005}
      HARNESS_STARTUP_TIMEOUT_MS: ${HARNESS_STARTUP_TIMEOUT_MS:-120000}
      ENV: local
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=512}
      USE_GO_MARKDOWN_PARSER: ${USE_GO_MARKDOWN_PARSER:-true}
    depends_on:
      redis:
        condition: service_started
      playwright-service:
        condition: service_started
      nuq-postgres:
        condition: service_started
    ports:
      - "${PORT:-3002}:${INTERNAL_PORT:-3002}"
    command: node dist/src/harness.js --start-docker
    # Sized for a 2-core / 4GiB host. Scrape/search/map/batch only (no extract).
    cpus: 1.0
    mem_limit: 1536m
    memswap_limit: 1536m

  redis:
    image: redis:alpine
    networks:
      - backend
    command: redis-server --bind 0.0.0.0 --maxmemory 32mb --maxmemory-policy noeviction --save ""
    restart: unless-stopped
    mem_limit: 48m
    memswap_limit: 48m
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

  nuq-postgres:
    build:
      context: apps/nuq-postgres
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        HTTP_PROXY: ${HTTP_PROXY:-http://host.docker.internal:7897}
        HTTPS_PROXY: ${HTTPS_PROXY:-http://host.docker.internal:7897}
        http_proxy: ${HTTP_PROXY:-http://host.docker.internal:7897}
        https_proxy: ${HTTPS_PROXY:-http://host.docker.internal:7897}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
      - -c
      - effective_cache_size=64MB
    networks:
      - backend
    restart: unless-stopped
    mem_limit: 192m
    memswap_limit: 192m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

networks:
  backend:
    driver: bridge
